# Ruff configuration for pegaflow-hust repo root.
# The CI action runs `ruff check` from the repo root.

extend-exclude = [
    "target/",
    ".github/",
    "pegaflow-core/",
    # Benchmark scripts — not production code
    "run_trace_audit.py",
    # Trace artifacts — log data, not Python
    "results/",
    # Upstream scripts with pre-existing issues
    "scripts/",
    # Archived legacy scripts — kept for reference, not linted
    "_archived_scripts/",
]

[lint]
ignore = []
